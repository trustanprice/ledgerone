AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LedgerOne raw-data bucket + GitHub Actions OIDC deploy role, per environment.
  Assumes the GitHub OIDC provider (token.actions.githubusercontent.com) already
  exists in this account (created once, out of band).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment. Must match a GitHub Environment name in the repo.

  GitHubRepo:
    Type: String
    Default: trustanprice/ledgerone
    Description: GitHub repo in "org/repo" form allowed to assume the deploy role.

  RawDataExpirationDays:
    Type: Number
    Default: 90
    Description: Days after which objects in the raw-data bucket are permanently deleted.

  AlertingTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:387143718798:ledgerone-billing-alerts
    Description: >
      SNS topic dbt-build.yml publishes to on failure. Not managed by this
      stack (created directly via CLI for the billing alarm, documented in
      infra/AGENTS.md's "Cost monitoring" section, not yet moved into
      CloudFormation) -- this parameter just lets the deploy role publish
      to it, it doesn't create or own the topic.

Conditions:
  # AWS/Billing metrics and this account's spend are account-wide, not
  # per-environment -- deploying this template to BOTH ledgerone-dev and
  # ledgerone-prod must not try to create/import the same real alarm,
  # topic, and dashboard twice. Prod-only, arbitrarily but consistently
  # with dbt-build.yml's schedule trigger also only ever targeting prod.
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:

  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ledgerone-raw-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawData
            Status: Enabled
            ExpirationInDays: !Ref RawDataExpirationDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RawDataExpirationDays

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ledgerone-${Environment}-github-actions"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:${Environment}"
      Policies:
        - PolicyName: RawDataBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RawDataBucket.Arn
              - Sid: ReadWriteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${RawDataBucket.Arn}/*"
        - PolicyName: ChangeSetPreview
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PreviewStackChanges
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ledgerone-${Environment}/*"
                # Deliberately narrow: no ExecuteChangeSet, no iam:* of any
                # kind. This role can show a diff, never apply one — see
                # infra/AGENTS.md's "Why the deploy role can preview but
                # not apply changes" for the privilege-escalation reasoning.
        - PolicyName: PipelineAlerting
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishFailureAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertingTopicArn
                # Scoped to exactly this one topic, nothing broader — this
                # role can notify on its own pipeline's failures, not
                # publish to arbitrary SNS topics in the account.

  # Below: the billing alarm/topic/dashboard infra/AGENTS.md's "Cost
  # monitoring" section documents as CLI-created, real resources that
  # already exist in the account. These definitions are for IMPORTING
  # those existing resources into this stack, not creating new ones --
  # a plain `aws cloudformation deploy` would try to CREATE an alarm/
  # topic/dashboard with a name that already exists and fail. See that
  # AGENTS.md section for the exact `create-change-set --change-set-type
  # IMPORT` command and infra/import-billing-monitoring.json for the
  # resource-identifier mapping it needs.

  BillingAlertsTopic:
    Type: AWS::SNS::Topic
    Condition: IsProd
    Properties:
      TopicName: ledgerone-billing-alerts
      # Deliberately no `Subscription` property: the real email
      # subscription was confirmed out of band (a human clicked the
      # confirmation email) and stays out of CloudFormation on purpose --
      # declaring it here risks CloudFormation trying to reconcile or
      # replace an already-confirmed subscription on the next update.

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: ledgerone-billing-80-warning
      AlarmDescription: >
        Early warning under this account's $100 credit cap -- fires at
        $80, not at the cap itself.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BillingAlertsTopic
      OKActions:
        - !Ref BillingAlertsTopic

  BillingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: IsProd
    Properties:
      DashboardName: ledgerone-billing
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 24, "height": 8,
              "properties": {
                "title": "Estimated Monthly Charges (USD)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 21600,
                "stat": "Maximum",
                "metrics": [
                  ["AWS/Billing", "EstimatedCharges", "Currency", "USD"]
                ],
                "annotations": {
                  "horizontal": [
                    { "label": "Warning ($80)", "value": 80 },
                    { "label": "Credit cap ($100)", "value": 100 }
                  ]
                }
              }
            }
          ]
        }

Outputs:
  BucketName:
    Description: Raw-data bucket name
    Value: !Ref RawDataBucket

  BucketArn:
    Description: Raw-data bucket ARN
    Value: !GetAtt RawDataBucket.Arn

  DeployRoleArn:
    Description: ARN to use as role-to-assume in the GitHub Actions workflow
    Value: !GetAtt GitHubActionsDeployRole.Arn
