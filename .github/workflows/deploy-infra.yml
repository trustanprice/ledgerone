name: Deploy LedgerOne Infra

on:
  # No push trigger, still deliberate: the deploy role can now create and
  # describe changesets (CreateChangeSet/DescribeChangeSet/DescribeStacks/
  # GetTemplate/ListChangeSets, scoped to this one stack's ARN — see
  # infra/ledgerone-stack.yml's ChangeSetPreview policy) but explicitly
  # cannot execute one (no ExecuteChangeSet, no iam:* of any kind) — so it
  # can show a diff, never apply it. Actually applying still requires a
  # human, running `execute-change-set` from an authenticated admin
  # session (the job summary below prints the exact command against the
  # real changeset it just created) — the same human-in-the-loop shape
  # the original bootstrap used. Auto-triggering this on every push to
  # main would just create a changeset nobody asked to review yet;
  # dispatch-only keeps that deliberate too.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # required to request the OIDC token from GitHub
  contents: read

jobs:
  deploy-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Preview stack changes
        run: |
          aws cloudformation deploy \
            --template-file infra/ledgerone-stack.yml \
            --stack-name ledgerone-dev \
            --parameter-overrides Environment=dev GitHubRepo=trustanprice/ledgerone \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset \
            --no-fail-on-empty-changeset

      - name: Surface changeset diff
        if: always()
        run: infra/scripts/summarize-changeset.sh ledgerone-dev

  deploy-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod   # attach required-reviewer protection rules to this Environment in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Preview stack changes
        run: |
          aws cloudformation deploy \
            --template-file infra/ledgerone-stack.yml \
            --stack-name ledgerone-prod \
            --parameter-overrides Environment=prod GitHubRepo=trustanprice/ledgerone \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset \
            --no-fail-on-empty-changeset

      - name: Surface changeset diff
        if: always()
        run: infra/scripts/summarize-changeset.sh ledgerone-prod
