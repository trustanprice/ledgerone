name: Deploy LedgerOne Infra

on:
  # No push trigger: the deploy role only has S3 permissions (see
  # infra/ledgerone-stack.yml), not CloudFormation, so it can't actually
  # redeploy its own stack yet. Whether to grant it that (a self-modifying
  # CI role that can rewrite its own IAM trust policy) is a deliberate
  # security tradeoff, not a default to fall into via an auto-trigger.
  # Until that's decided, infra changes go through the same manual,
  # human-reviewed changeset flow the initial bootstrap used. This
  # workflow stays here as the shape a future automated version would
  # take, dispatch-only, not wired to run yet.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # required to request the OIDC token from GitHub
  contents: read

jobs:
  deploy-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file infra/ledgerone-stack.yml \
            --stack-name ledgerone-dev \
            --parameter-overrides Environment=dev GitHubRepo=trustanprice/ledgerone \
            --capabilities CAPABILITY_NAMED_IAM

  deploy-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod   # attach required-reviewer protection rules to this Environment in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file infra/ledgerone-stack.yml \
            --stack-name ledgerone-prod \
            --parameter-overrides Environment=prod GitHubRepo=trustanprice/ledgerone \
            --capabilities CAPABILITY_NAMED_IAM
