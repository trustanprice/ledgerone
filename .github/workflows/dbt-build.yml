name: dbt Build (cloud)

# Runs the same pipeline `make all`'s generate+build steps run locally,
# but against a cloud target: raw parquet gets synced to this environment's
# S3 bucket for archival (dbt does NOT read from S3 here - it still reads
# the local files this same run just generated, same as `make build` does
# locally; the S3 copy is durability/lifecycle-managed storage, not a dbt
# source) and `dbt build` points at MotherDuck instead of a local .duckdb
# file. See infra/ledgerone-stack.yml for the S3 bucket + IAM role this
# depends on, and dbt/profiles.yml for the `prod` target added alongside
# the existing local `dev` one.
#
# Runs daily against prod via the schedule trigger below, plus
# workflow_dispatch for manual runs against either environment. The
# schedule trigger only landed after: a handful of clean manual dispatches
# against both dev and prod (136/136 dbt tests, verified from real run
# logs and a direct S3 bucket listing), and real push-based alerting on
# failure (see the "Report failure" step) -- an unattended run needs a
# way to actually notify someone, not just leave a job-summary banner
# nobody's looking at.
#
# `inputs.environment` only exists on workflow_dispatch runs -- a
# `schedule` trigger has no `inputs` context at all, so every reference
# below uses `inputs.environment || 'prod'`, not `inputs.environment`
# directly. Scheduled runs always target prod; dev is manual-dispatch-only.
#
# Note the dbt --target below is NOT just the environment name:
# dbt/profiles.yml's `dev` target is the pre-existing LOCAL-file target
# every contributor already uses for `make all` on their own machine -
# reusing that name for this workflow's cloud dev run would silently
# point CI at a local .duckdb path that doesn't exist on a fresh runner
# (this is exactly the bug that first shipped here - see git history).
# `ci_dev` is a separate MotherDuck-backed target so the two "dev"s never
# collide on the same profile name.

on:
  schedule:
    # Daily, 10:00 UTC. Always targets prod -- see the note above on why
    # `inputs.environment || 'prod'` appears everywhere below instead of
    # `inputs.environment` alone.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build against
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # required to request the OIDC token from GitHub
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    env:
      LEDGERONE_DB_PATH: ${{ github.workspace }}/data/processed/ledgerone.duckdb
      LEDGERONE_RAW_DIR: ${{ github.workspace }}/data/raw
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          venv/bin/python src/generate_data.py
          venv/bin/python src/generate_credit_risk_data.py

      - name: Sync raw data to S3 (archival)
        run: |
          aws s3 sync data/raw/ "s3://ledgerone-raw-${{ inputs.environment || 'prod' }}-387143718798/"

      - name: dbt build
        run: |
          venv/bin/dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ${{ inputs.environment == 'dev' && 'ci_dev' || 'prod' }}

      - name: Report failure
        # Two channels, deliberately: the job summary (pull-based --
        # visible if someone opens the Actions tab) plus a real SNS
        # publish (push-based -- reaches an inbox with nobody watching).
        # Reuses the existing ledgerone-billing-alerts topic/subscription
        # rather than provisioning a second notification channel just for
        # pipeline failures -- one already-confirmed email is simpler than
        # two, and "AWS spend crossed a threshold" and "the pipeline that
        # runs against that spend broke" are both things the same person
        # wants to know about. Needs sns:Publish on that topic, granted to
        # this role in infra/ledgerone-stack.yml's PipelineAlerting policy.
        if: failure()
        env:
          RUN_ENV: ${{ inputs.environment || 'prod' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## :x: dbt-build failed — $RUN_ENV"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Check the failed step above for the actual error."
          } >> "$GITHUB_STEP_SUMMARY"

          aws sns publish \
            --topic-arn arn:aws:sns:us-east-1:387143718798:ledgerone-billing-alerts \
            --subject "dbt-build failed — $RUN_ENV" \
            --message "dbt-build.yml failed against $RUN_ENV. Run: $RUN_URL"
