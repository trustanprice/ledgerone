name: dbt Build (cloud)

# Runs the same pipeline `make all`'s generate+build steps run locally,
# but against a cloud target: raw parquet gets synced to this environment's
# S3 bucket for archival (dbt does NOT read from S3 here - it still reads
# the local files this same run just generated, same as `make build` does
# locally; the S3 copy is durability/lifecycle-managed storage, not a dbt
# source) and `dbt build` points at MotherDuck instead of a local .duckdb
# file. See infra/ledgerone-stack.yml for the S3 bucket + IAM role this
# depends on, and dbt/profiles.yml for the `prod` target added alongside
# the existing local `dev` one.
#
# workflow_dispatch only, deliberately no schedule trigger yet - add a
# `schedule:` trigger only after a manual dev run has been confirmed clean
# end to end (role assumption, S3 write, dbt build all succeed).
#
# Note the dbt --target below is NOT just `${{ inputs.environment }}`:
# dbt/profiles.yml's `dev` target is the pre-existing LOCAL-file target
# every contributor already uses for `make all` on their own machine -
# reusing that name for this workflow's cloud dev run would silently
# point CI at a local .duckdb path that doesn't exist on a fresh runner
# (this is exactly the bug that first shipped here - see git history).
# `ci_dev` is a separate MotherDuck-backed target so the two "dev"s never
# collide on the same profile name.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build against
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # required to request the OIDC token from GitHub
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      LEDGERONE_DB_PATH: ${{ github.workspace }}/data/processed/ledgerone.duckdb
      LEDGERONE_RAW_DIR: ${{ github.workspace }}/data/raw
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          venv/bin/python src/generate_data.py
          venv/bin/python src/generate_credit_risk_data.py

      - name: Sync raw data to S3 (archival)
        run: |
          aws s3 sync data/raw/ "s3://ledgerone-raw-${{ inputs.environment }}-387143718798/"

      - name: dbt build
        run: |
          venv/bin/dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target ${{ inputs.environment == 'dev' && 'ci_dev' || 'prod' }}

      - name: Report failure
        # Pull-based visibility, not push-based alerting: this makes a
        # broken run impossible to miss *if someone opens the Actions
        # tab*, same as any other step summary. It does not page, email,
        # or Slack-ping anyone. That distinction doesn't matter much for
        # a dispatch-only workflow a human just triggered and is already
        # watching — it matters a lot for the eventual scheduled/cron
        # version, where by definition no one is watching. Real
        # push-based alerting (Slack webhook, email via SES, a CloudWatch
        # alarm) is still worth adding before that cron trigger lands;
        # this step is the simplest viable improvement over "nothing,"
        # not a replacement for that.
        if: failure()
        run: |
          {
            echo "## :x: dbt-build failed — ${{ inputs.environment }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Check the failed step above for the actual error."
          } >> "$GITHUB_STEP_SUMMARY"
