name: Deploy walkthrough to GitHub Pages

# Builds apps/walkthrough/ (a static React/Vite site — see its AGENTS.md)
# and publishes it to GitHub Pages at
# https://trustanprice.github.io/ledgerone/ whenever it
# changes on main. Nothing else in this repo is deployed by this
# workflow — the dbt project and Python pipeline stay local-only.

on:
  push:
    branches: [main]
    paths:
      - 'apps/walkthrough/**'
      - '.github/workflows/deploy-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/walkthrough/package-lock.json

      - name: Install dependencies
        working-directory: apps/walkthrough
        run: npm ci

      - name: Build
        working-directory: apps/walkthrough
        run: npm run build
        env:
          VITE_BASE_PATH: /ledgerone/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/walkthrough/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
